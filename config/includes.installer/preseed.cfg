# interkit installer: answers that are safe to preset. NOT preset on purpose: the user's password,
# the target disk (when there is more than one) and the final "write changes to disk" confirmation.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string interkit
d-i netcfg/get_domain string
d-i netcfg/hostname string interkit
d-i time/zone string Etc/UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean false

# no root login; one normal user (sudo). The user name and password are asked during the install.
# (Not preset: 'admin' is a reserved name and the installer rejects it.)
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true

# one plain partition layout, GPT (EFI system partition is added automatically on UEFI)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/default_label string gpt
d-i grub-installer/bootdev string default

d-i popularity-contest/participate boolean false
d-i finish-install/reboot_in_progress note
