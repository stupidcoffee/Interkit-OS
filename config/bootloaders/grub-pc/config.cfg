set default=0
# interkit: boot the default entry after 5 s so headless/unattended boots do not wait forever at the menu
set timeout=5

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Copied from the netinst image
if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    # x86-only video drivers: they do not exist on arm64 (GRUB would print "file not found" errors)
    if [ "$grub_cpu" = x86_64 -o "$grub_cpu" = i386 ] ; then
        insmod efi_uga
        insmod video_bochs
        insmod video_cirrus
    fi
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

insmod play
play 960 440 1 0 4 440 1
